name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 写入配置（来自仓库 Secrets；未配置则用占位值，仅用于验证能否构建）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
          AMAP_IOS_KEY: ${{ secrets.AMAP_IOS_KEY }}
          AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY }}
        run: |
          mkdir -p env
          python3 - <<'PY'
          import json, os
          d = {k: os.environ.get(k) or 'PLACEHOLDER' for k in ['SUPABASE_URL','SUPABASE_ANON_KEY','AMAP_ANDROID_KEY','AMAP_IOS_KEY','AMAP_WEB_KEY']}
          json.dump(d, open('env/ci.json','w'))
          PY
      - name: 签名（可选）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=couple\nstoreFile=upload-keystore.jks\n' "$KS_PASSWORD" "$KS_PASSWORD" > android/key.properties
          fi
      - run: bash scripts/build_apk.sh env/ci.json
        env:
          SKIP_SPLIT: "1"
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  ios:
    needs: test
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        variant: [noext, widgets]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 写入配置
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
          AMAP_IOS_KEY: ${{ secrets.AMAP_IOS_KEY }}
          AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY }}
        run: |
          mkdir -p env
          python3 - <<'PY'
          import json, os
          d = {k: os.environ.get(k) or 'PLACEHOLDER' for k in ['SUPABASE_URL','SUPABASE_ANON_KEY','AMAP_ANDROID_KEY','AMAP_IOS_KEY','AMAP_WEB_KEY']}
          json.dump(d, open('env/ci.json','w'))
          PY
      - name: 构建未签名 IPA（${{ matrix.variant }}）
        run: |
          if [ "${{ matrix.variant }}" = "widgets" ]; then
            bash scripts/build_ipa.sh --with-widgets env/ci.json
          else
            bash scripts/build_ipa.sh env/ci.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ matrix.variant }}
          path: dist/*.ipa

  release:
    # 仅 main 分支的 push：构建全部成功后自动发布 GitHub Release，用户直接在 Release 页下载安装
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 整理并发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          TAG="v1.0.${{ github.run_number }}"
          mkdir -p rel
          cp artifacts/android-apk/app-release.apk rel/CoupleLocator-android.apk
          cp artifacts/ios-ipa-noext/CoupleLocator-noext.ipa rel/CoupleLocator-ios-noext.ipa
          cp artifacts/ios-ipa-widgets/CoupleLocator-widgets.ipa rel/CoupleLocator-ios-widgets.ipa
          SUBJECT="$(printf '%s' "$MSG" | head -n1)"
          cat > notes.md <<EOF
          ## 本次更新
          ${SUBJECT}

          ## 怎么装
          - **Android**：下载 \`CoupleLocator-android.apk\` 直接安装（首次需允许“安装未知应用”）。
          - **iOS**：下载 IPA 后用全能签 / AltStore / Sideloadly 重签安装。先试 \`CoupleLocator-ios-noext.ipa\`（不含小组件，最稳）；\`CoupleLocator-ios-widgets.ipa\` 含小组件和实时活动，重签后可能受限。
          - 未签名的 IPA 不能直接装；Android APK 用仓库内固定密钥签名，覆盖安装升级不会冲突。

          提交：${GITHUB_SHA::7}
          EOF
          gh release create "$TAG" rel/* --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
