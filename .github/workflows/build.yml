name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 写入配置（来自仓库 Secrets；未配置则用占位值，仅用于验证能否构建）
        env:
          # Supabase URL / anon key 是公开值（本就会打进 App），未配置 Secrets 时使用默认值
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lajpyaigqqtnqguwcbhf.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhanB5YWlncXF0bnFndXdjYmhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3NTY2ODEsImV4cCI6MjEwOTMzMjY4MX0.VWNnWOGt-pWXkyWKeA-8yZjwNaw3J835bbmIVqqiAqg' }}
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
          AMAP_IOS_KEY: ${{ secrets.AMAP_IOS_KEY }}
          AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY }}
        run: |
          mkdir -p env
          python3 - <<'PY'
          import json, os
          d = {k: os.environ.get(k) or 'PLACEHOLDER' for k in ['SUPABASE_URL','SUPABASE_ANON_KEY','AMAP_ANDROID_KEY','AMAP_IOS_KEY','AMAP_WEB_KEY']}
          json.dump(d, open('env/ci.json','w'))
          PY
      - name: 签名（可选）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=couple\nstoreFile=upload-keystore.jks\n' "$KS_PASSWORD" "$KS_PASSWORD" > android/key.properties
          fi
      - run: bash scripts/build_apk.sh env/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  ios:
    needs: test
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        variant: [noext, widgets]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 写入配置
        env:
          # Supabase URL / anon key 是公开值（本就会打进 App），未配置 Secrets 时使用默认值
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lajpyaigqqtnqguwcbhf.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhanB5YWlncXF0bnFndXdjYmhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3NTY2ODEsImV4cCI6MjEwOTMzMjY4MX0.VWNnWOGt-pWXkyWKeA-8yZjwNaw3J835bbmIVqqiAqg' }}
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
          AMAP_IOS_KEY: ${{ secrets.AMAP_IOS_KEY }}
          AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY }}
        run: |
          mkdir -p env
          python3 - <<'PY'
          import json, os
          d = {k: os.environ.get(k) or 'PLACEHOLDER' for k in ['SUPABASE_URL','SUPABASE_ANON_KEY','AMAP_ANDROID_KEY','AMAP_IOS_KEY','AMAP_WEB_KEY']}
          json.dump(d, open('env/ci.json','w'))
          PY
      - name: 构建未签名 IPA（${{ matrix.variant }}）
        run: |
          if [ "${{ matrix.variant }}" = "widgets" ]; then
            bash scripts/build_ipa.sh --with-widgets env/ci.json
          else
            bash scripts/build_ipa.sh env/ci.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ matrix.variant }}
          path: dist/*.ipa
