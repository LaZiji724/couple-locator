name: couple_locator
description: 情侣/双人私密实时位置共享 App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  supabase_flutter: ^2.10.0
  drift: ^2.28.0
  drift_flutter: any
  sqlite3_flutter_libs: any
  path_provider: any
  path: any
  flutter_secure_storage: ^11.0.0
  cryptography: ^2.9.0
  geolocator: ^14.0.0
  flutter_foreground_task: ^11.0.0
  workmanager: ^0.10.0
  flutter_local_notifications: ^22.0.0
  battery_plus: ^7.0.0
  connectivity_plus: ^7.0.0
  home_widget: ^0.10.0
  live_activities: ^2.6.0
  amap_map: ^1.0.15
  x_amap_base: any
  phosphor_flutter:
    path: packages/phosphor_flutter
  lottie: ^3.3.0
  fl_chart: ^1.0.0
  table_calendar: ^3.2.0
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.0
  permission_handler: any
  shared_preferences: any
  uuid: any
  intl: any
  http: any
  url_launcher: any
  flutter_activity_recognition: any
  device_info_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  drift_dev: any
  build_runner: any

flutter:
  uses-material-design: true
  assets:
    - assets/map_style/
    - assets/lottie/

dependency_overrides:
  permission_handler_android: 13.0.1
